<!doctype html>
<html lang="fr">
<head>
 <meta charset="utf-8">
 <meta name="viewport" content="width=device-width,initial-scale=1">
 <meta name="robots" content="noindex">
 <title>LUMEN · Aperçu saisonnier</title>
 <style>
  :root{color-scheme:dark}body{margin:0;background:#07111d;color:#eef7ff;font:16px system-ui}
  main{max-width:1180px;margin:auto;padding:16px}h1{margin:0 0 8px}
  .controls{display:flex;gap:12px;flex-wrap:wrap;margin:16px 0}
  label{display:grid;gap:5px;font-weight:600}input,select{font:inherit;padding:7px}
  iframe{display:block;width:100%;height:800px;margin:auto;border:1px solid #304d67;border-radius:14px;background:#0b1726}
  iframe[data-format="mobile"]{width:min(100%,390px);height:720px}
  iframe[data-format="landscape"]{width:min(100%,740px);height:390px}
 </style>
 <script type="module" src="/src/acquisition/seasonal-studio.js"></script>
</head>
<body>
 <main>
  <h1>LUMEN · Aperçu saisonnier</h1>
  <p>Démonstration sur une grille d’initiation. Les résultats affichés sont fictifs.</p>
  <div class="controls">
   <label>Date <input id="date" type="date" value="2026-12-01"></label>
   <label>Langue <select id="locale"><option value="fr">Français</option><option value="en">English</option><option value="es">Español</option></select></label>
   <label>Écran <select id="view"><option value="play">Jeu</option><option value="sky">Mon ciel</option><option value="victory">Victoire et inscription</option></select></label>
   <label>Format <select id="format"><option value="mobile">Mobile</option><option value="landscape">Paysage</option><option value="desktop">Ordinateur</option></select></label>
  </div>
  <iframe id="seasonal-preview" title="Aperçu de démonstration LUMEN" data-format="mobile" sandbox="allow-scripts allow-same-origin"></iframe>
 </main>
</body>
</html>
