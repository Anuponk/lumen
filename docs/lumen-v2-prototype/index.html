<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; img-src 'self' data:; connect-src 'self'; worker-src 'none'; frame-src 'none'; object-src 'none'; form-action 'none'; base-uri 'none'"
    />
    <title>LUMEN V2 · Prototype de recette</title>
    <link rel="icon" href="../../icon.svg" />
    <link rel="stylesheet" href="../../src/ui/styles.css" />
    <link rel="stylesheet" href="prototype.css" />
    <script type="module" src="prototype.js"></script>
  </head>
  <body class="prototype">
    <div class="preview-shell">
      <header class="preview-header">
        <button type="button" class="context-back" data-back aria-label="Retour" hidden>‹</button>
        <div class="preview-brand">
          <img src="../../icon.svg" alt="" width="26" height="26" />
          <span id="preview-brand-title">Mon ciel</span>
        </div>
        <div class="preview-header-actions">
          <button
            type="button"
            class="header-icon"
            data-go="E33"
            aria-label="Notifications"
            title="Notifications"
          >
            <span class="notification-icon" aria-hidden="true">🔔</span>
            <span id="notification-count" aria-hidden="true" hidden></span>
          </button>
          <button
            type="button"
            class="header-icon"
            data-go="E35"
            aria-label="Mon espace"
            title="Mon espace"
          >
            <svg viewBox="0 0 24 24" width="19" height="19" aria-hidden="true" focusable="false">
              <circle cx="12" cy="8.3" r="3.9" fill="currentColor" />
              <path d="M4.3 20.2c.8-4.2 3.9-6.5 7.7-6.5s6.9 2.3 7.7 6.5z" fill="currentColor" />
            </svg>
          </button>
        </div>
      </header>
      <main id="screen" tabindex="-1"></main>
      <nav id="primary" aria-label="Navigation principale">
        <button type="button" data-go="E10"><span aria-hidden="true">▷</span>Jouer</button>
        <button type="button" data-go="E04"><span aria-hidden="true">✦</span>Mon ciel</button>
        <button type="button" data-go="E25"><span aria-hidden="true">♜</span>Classements</button>
        <button type="button" data-go="E27"><span aria-hidden="true">♧</span>Social</button>
      </nav>
    </div>
    <details class="storyboard">
      <summary>Prototype · progression simulée · référentiel de recette</summary>
      <label for="scenario">État du storyboard</label>
      <select id="scenario"></select>
      <label for="daily-status">Défi du jour</label>
      <select id="daily-status">
        <option value="open">À jouer</option>
        <option value="played">Joué</option>
        <option value="closed">Indisponible</option>
      </select>
      <a id="baseline" href="../validation/lumen-v2-1081/v1-390.png">Comparer à Mon ciel V1</a>
    </details>
  </body>
</html>
