name: Cloud persistence contract
on:
  pull_request:
    types: [opened, edited, synchronize, reopened]
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  cloud-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify permanent cloud contract and PR declaration
        run: node scripts/cloud-contract-check.mjs
      - name: Run isolated cloud persistence regression tests
        run: node scripts/cloud-persistence-regression-tests.mjs
