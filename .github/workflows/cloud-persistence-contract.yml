name: Cloud persistence contract
on:
  pull_request:
    types: [opened, edited, synchronize, reopened]
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  cloud-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify permanent cloud contract and PR declaration
        run: node scripts/cloud-contract-check.mjs
      - name: Run isolated cloud persistence regression tests
        run: node scripts/cloud-persistence-regression-tests.mjs
