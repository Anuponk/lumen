name: Adventure 5 staging validation
on:
  pull_request:
    paths:
      - 'content/fifth-adventure-preview.json'
      - 'content/generated/fifth-adventure-candidates.json'
      - 'scripts/generate-fifth-adventure.mjs'
      - 'scripts/validate-fifth-adventure.mjs'
      - '.github/workflows/adventure-05-staging.yml'
  push:
    branches: [content/adventure-05-staging]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  generate-and-validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Generate 100 explainable candidate grids
        run: node scripts/generate-fifth-adventure.mjs
      - name: Validate 100 candidates with the actual proof engine
        run: node scripts/validate-fifth-adventure.mjs
      - name: Commit validated candidates to staging branch
        if: github.event_name == 'push'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add content/generated/fifth-adventure-candidates.json
          if ! git diff --cached --quiet; then
            git commit -m 'content: record proof-audited Adventure 5 candidates (#598)'
            git push origin HEAD:content/adventure-05-staging
          fi
      - name: Upload validated candidate manifest
        uses: actions/upload-artifact@v4
        with:
          name: adventure-05-proof-audited
          path: artifacts/adventure-05-candidates.json
          retention-days: 14
