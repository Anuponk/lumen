name: Adventure 5 staging generation
on:
  push:
    branches: [content/adventure-05-staging]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Generate and audit candidate grids (no publication)
        run: node scripts/generate-fifth-adventure.mjs
        # Dedicated staging generation rerun; do not publish to runtime.
      - name: Upload candidate manifest
        uses: actions/upload-artifact@v4
        with:
          name: adventure-05-candidates
          path: artifacts/adventure-05-candidates.json
          retention-days: 14
