name: Account deletion request journey
on:
  pull_request:
    branches: [main]
    paths:
      - 'scripts/account-deletion-request-journey.test.mjs'
      - 'src/privacy/account-deletion.js'
      - 'supprimer-compte.html'
      - '.github/workflows/account-deletion-request-journey.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  deletion-request:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test scripts/account-deletion-request-journey.test.mjs
