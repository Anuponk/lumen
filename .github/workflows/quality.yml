name: Lumen quality gate

on:
  pull_request:
    branches: [main]

permissions:
  contents: read
  actions: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      run_full: ${{ steps.scope.outputs.run_full }}
      # #744: docs, landing (presentation page only) or full; empty means full.
      scope: ${{ steps.scope.outputs.scope }}
      run_learning: ${{ steps.learning_scope.outputs.run_learning }}
    steps:
      - name: Checkout PR
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Classify the pull request scope (documentation, presentation page or full)
        id: scope
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        shell: bash
        run: |
          # Fail closed: any ambiguity executes the full gate.
          echo "run_full=true" >> "$GITHUB_OUTPUT"
          if ! git cat-file -e "$BASE_SHA^{commit}" || ! git cat-file -e "$HEAD_SHA^{commit}"; then
            echo "Cannot resolve both PR commits; running full gate"
            exit 0
          fi
          if ! git diff --name-only --no-renames "$BASE_SHA" "$HEAD_SHA" > /tmp/lumen-changed-paths; then
            echo "Cannot classify PR diff; running full gate"
            exit 0
          fi
          # #744: classify with the BASE version of the script, so a pull request can never
          # loosen its own scope; a base without the script keeps the full gate.
          if git show "$BASE_SHA:scripts/ci-scope.mjs" > /tmp/ci-scope.mjs 2>/dev/null; then
            node /tmp/ci-scope.mjs /tmp/lumen-changed-paths
          else
            echo "Scope classifier absent from the base; running the full gate"
          fi

      - name: Select learning browser coverage
        id: learning_scope
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          echo "run_learning=true" >> "$GITHUB_OUTPUT"
          if [[ "$GITHUB_EVENT_NAME" != "pull_request" ]]; then exit 0; fi
          if [[ -z "$BASE_SHA" || -z "$HEAD_SHA" ]]; then exit 0; fi
          if ! git diff --name-only --no-renames "$BASE_SHA" "$HEAD_SHA" > /tmp/lumen-learning-changes.txt; then
            echo "Diff unavailable; retain full learning coverage"
            exit 0
          fi
          python3 - <<'PY'
          import os
          from pathlib import Path
          changed=[p.strip() for p in Path('/tmp/lumen-learning-changes.txt').read_text().splitlines() if p.strip()]
          def safe_to_skip(p):
              if p == 'AGENTS.md' or (p.startswith('docs/') and p.endswith('.md') and not p.startswith('docs/validation/')):
                  return True
              if p.startswith('src/'):
                  # Only narrowly isolated features; shared gameplay, UI, auth and persistence stay covered.
                  return p.startswith(('src/persistence/ranking.js','src/ui/ranking.js','src/ui/personal-records.js'))
              if p.startswith('scripts/'):
                  return p in ('scripts/ranking-tests.mjs','scripts/ranking-client-tests.mjs','scripts/personal-records-tests.mjs')
              return False
          if changed and all(safe_to_skip(p) for p in changed):
              with open(os.environ['GITHUB_OUTPUT'],'a') as out: out.write('run_learning=false\n')
              print('Learning browser suite skipped for isolated changes:',', '.join(changed))
          else:
              print('Learning browser suite required (shared or uncertain impact)')
          PY


  node:
    needs: prepare
    if: needs.prepare.outputs.run_full == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout PR
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Check reproducible formatting
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npm run format:check

      - name: Validate o2switch release script syntax
        run: |
          for script in scripts/o2switch-{safe-release,cron-publish,deploy-monitor,ssh-deploy,runner-firewall,webhook-worker,install-webhook}.sh; do bash -n "$script"; done
          python3 scripts/o2switch-deploy-tests.py
          php -l scripts/o2switch-deploy-hook.php
          python3 scripts/o2switch-https-tests.py

      - name: Validate offline issue 222 generator syntax
        run: node --check scripts/issue-222-generate-grids.mjs && node --check scripts/issue-222-migration-plan.mjs

      - name: Validate Android offline shell preflight
        run: node scripts/android-offline-preflight.mjs

      - name: Complete cloud profile backup regression
        if: needs.prepare.outputs.scope != 'landing'
        run: node scripts/cloud-profile-tests.mjs

      - name: Cross-device cloud persistence regression matrix
        if: needs.prepare.outputs.scope != 'landing'
        run: node scripts/cloud-regression-matrix-tests.mjs

      - name: Guest save migration recovery regression
        if: needs.prepare.outputs.scope != 'landing'
        run: node scripts/guest-transfer-tests.mjs

      - name: OAuth redirect regression
        if: needs.prepare.outputs.scope != 'landing'
        run: node scripts/oauth-return.test.mjs

      - name: Unified quality gate (Node)
        env:
          LUMEN_VALIDATION_DIR: ${{ runner.temp }}/lumen-validation
          LUMEN_QUALITY_SCOPE: ${{ needs.prepare.outputs.scope || 'full' }}
        run: node scripts/quality-gate.mjs --node-only
      - name: Upload Node timing report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lumen-validation-node
          path: ${{ runner.temp }}/lumen-validation/ci-quality-summary.json
          retention-days: 14
          if-no-files-found: error

  browser:
    needs: prepare
    if: needs.prepare.outputs.run_full == 'true'
    runs-on: ubuntu-latest
    # Keep the actual victory viewing period and two isolated workers per runner.
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      - name: Checkout PR
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Unified quality gate (browser shard)
        env:
          LUMEN_BROWSER_WORKERS: '2'
          LUMEN_VALIDATION_DIR: ${{ runner.temp }}/lumen-validation
          LUMEN_RUN_LEARNING_BROWSER: ${{ needs.prepare.outputs.run_learning }}
          LUMEN_QUALITY_SCOPE: ${{ needs.prepare.outputs.scope || 'full' }}
        run: node scripts/quality-gate.mjs --browser-shard=${{ matrix.shard }}/3
      - name: Upload browser reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lumen-validation-browser-${{ matrix.shard }}
          path: ${{ runner.temp }}/lumen-validation/ci-*.json
          retention-days: 14
          if-no-files-found: error

  quality:
    needs: [prepare, node, browser]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Require all quality results
        env:
          PREPARE_RESULT: ${{ needs.prepare.result }}
          RUN_FULL: ${{ needs.prepare.outputs.run_full }}
          NODE_RESULT: ${{ needs.node.result }}
          BROWSER_RESULT: ${{ needs.browser.result }}
        run: node scripts/quality-gate-result.mjs
