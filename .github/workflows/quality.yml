name: Lumen quality gate

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
  # Some bot-mediated squash merges do not generate a new push workflow run.
  # A scheduled verification on main makes the publisher fully unattended.
  schedule:
    - cron: '*/10 * * * *'

permissions:
  contents: read
  actions: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout PR
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Skip redundant scheduled quality runs for an already validated SHA
        id: scheduled_check
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          echo "need_tests=true" >> "$GITHUB_OUTPUT"
          if [[ "$GITHUB_EVENT_NAME" != "schedule" ]]; then exit 0; fi
          python3 - <<'PY'
          import json,os,urllib.request
          sha=os.environ["GITHUB_SHA"]
          repo=os.environ["GITHUB_REPOSITORY"]
          url=f"https://api.github.com/repos/{repo}/actions/workflows/quality.yml/runs?branch=main&per_page=50"
          request=urllib.request.Request(url,headers={
            "Accept":"application/vnd.github+json",
            "Authorization":"Bearer "+os.environ["GH_TOKEN"],
            "User-Agent":"lumen-quality-schedule"
          })
          try:
            with urllib.request.urlopen(request,timeout=20) as response:
              runs=json.load(response)["workflow_runs"]
          except Exception as exc:
            print("Prior CI lookup unavailable; run full quality:",exc)
            raise SystemExit(0)
          validated=any(r.get("head_sha")==sha and r.get("status")=="completed"
                        and r.get("conclusion")=="success" and
                        r.get("event") in ("push","workflow_dispatch","schedule")
                        for r in runs)
          if validated:
            with open(os.environ["GITHUB_OUTPUT"],"a") as output:
              output.write("need_tests=false\n")
            print("This main SHA already passed quality; no duplicate tests required")
          else:
            print("No completed green main CI for this SHA; running full quality")
          PY

      - name: Classify documentation-only pull requests
        id: scope
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        shell: bash
        run: |
          # Fail closed: any ambiguity executes the full gate.
          echo "run_full=true" >> "$GITHUB_OUTPUT"
          if ! git cat-file -e "$BASE_SHA^{commit}" || ! git cat-file -e "$HEAD_SHA^{commit}"; then
            echo "Cannot resolve both PR commits; running full gate"
            exit 0
          fi
          if ! git diff --name-only --no-renames "$BASE_SHA" "$HEAD_SHA" > /tmp/lumen-changed-paths; then
            echo "Cannot classify PR diff; running full gate"
            exit 0
          fi
          python3 - <<'PY'
          import os
          from pathlib import PurePosixPath
          paths = [p for p in open('/tmp/lumen-changed-paths', encoding='utf-8').read().splitlines() if p]
          def docs_only(path):
              if path == 'AGENTS.md':
                  return True
              return path.startswith('docs/') and path.endswith('.md') and not path.startswith('docs/validation/')
          if paths and all(docs_only(p) for p in paths):
              with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
                  output.write('run_full=false\n')
              print('Documentation-only PR: full runtime gate not needed; documentation CI remains separate')
          else:
              print('Code, workflow, generated files, or unknown scope: run full gate')
          PY

      - name: Explain quality gate scope
        if: github.event_name == 'pull_request' && steps.scope.outputs.run_full == 'false'
        run: echo "Documentation-only changes; full runtime gate skipped. Required quality job succeeds; documentation consistency runs independently."

      - name: Check reproducible formatting
        if: steps.scheduled_check.outputs.need_tests == 'true' && steps.scope.outputs.run_full != 'false'
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npm run format:check

      - name: Validate o2switch release script syntax
        if: steps.scheduled_check.outputs.need_tests == 'true' && steps.scope.outputs.run_full != 'false'
        run: |
          for script in scripts/o2switch-{safe-release,cron-publish,deploy-monitor,ssh-deploy,runner-firewall,webhook-worker,install-webhook}.sh; do bash -n "$script"; done
          python3 scripts/o2switch-deploy-tests.py
          php -l scripts/o2switch-deploy-hook.php
          python3 scripts/o2switch-https-tests.py

      - name: Validate offline issue 222 generator syntax
        if: steps.scheduled_check.outputs.need_tests == 'true' && steps.scope.outputs.run_full != 'false'
        run: node --check scripts/issue-222-generate-grids.mjs && node --check scripts/issue-222-migration-plan.mjs

      - name: Validate Android offline shell preflight
        if: steps.scheduled_check.outputs.need_tests == 'true' && steps.scope.outputs.run_full != 'false'
        run: node scripts/android-offline-preflight.mjs

      - name: Select learning browser coverage
        id: learning_scope
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          echo "run_learning=true" >> "$GITHUB_OUTPUT"
          if [[ "$GITHUB_EVENT_NAME" != "pull_request" ]]; then exit 0; fi
          if [[ -z "$BASE_SHA" || -z "$HEAD_SHA" ]]; then exit 0; fi
          if ! git diff --name-only --no-renames "$BASE_SHA" "$HEAD_SHA" > /tmp/lumen-learning-changes.txt; then
            echo "Diff unavailable; retain full learning coverage"
            exit 0
          fi
          python3 - <<'PY'
          import os
          from pathlib import Path
          changed=[p.strip() for p in Path('/tmp/lumen-learning-changes.txt').read_text().splitlines() if p.strip()]
          def safe_to_skip(p):
              if p == 'AGENTS.md' or (p.startswith('docs/') and p.endswith('.md') and not p.startswith('docs/validation/')):
                  return True
              if p.startswith('src/'):
                  # Only narrowly isolated features; shared gameplay, UI, auth and persistence stay covered.
                  return p.startswith(('src/persistence/ranking.js','src/ui/ranking.js','src/ui/personal-records.js'))
              if p.startswith('scripts/'):
                  return p in ('scripts/ranking-tests.mjs','scripts/ranking-client-tests.mjs','scripts/personal-records-tests.mjs')
              return False
          if changed and all(safe_to_skip(p) for p in changed):
              with open(os.environ['GITHUB_OUTPUT'],'a') as out: out.write('run_learning=false\n')
              print('Learning browser suite skipped for isolated changes:',', '.join(changed))
          else:
              print('Learning browser suite required (shared or uncertain impact)')
          PY

      - name: Unified quality gate
        if: steps.scheduled_check.outputs.need_tests == 'true' && steps.scope.outputs.run_full != 'false'
        env:
          LUMEN_BROWSER_WORKERS: '2'
          LUMEN_RUN_LEARNING_BROWSER: ${{ steps.learning_scope.outputs.run_learning }}
        run: node scripts/quality-gate.mjs

      - name: Complete cloud profile backup regression
        if: steps.scheduled_check.outputs.need_tests == 'true' && steps.scope.outputs.run_full != 'false'
        run: node scripts/cloud-profile-tests.mjs

      - name: Cross-device cloud persistence regression matrix
        if: steps.scheduled_check.outputs.need_tests == 'true' && steps.scope.outputs.run_full != 'false'
        run: node scripts/cloud-regression-matrix-tests.mjs

      - name: Guest save migration recovery regression
        if: steps.scheduled_check.outputs.need_tests == 'true' && steps.scope.outputs.run_full != 'false'
        run: node scripts/guest-transfer-tests.mjs

      - name: OAuth redirect regression
        if: steps.scheduled_check.outputs.need_tests == 'true' && steps.scope.outputs.run_full != 'false'
        run: node scripts/oauth-return.test.mjs

      - name: Verify cloud persistence policy on main
        if: steps.scheduled_check.outputs.need_tests == 'true' && steps.scope.outputs.run_full != 'false' && github.event_name != 'pull_request'
        run: node scripts/cloud-contract-check.mjs

      - name: Upload validation reports
        if: always() && steps.scheduled_check.outputs.need_tests == 'true' && steps.scope.outputs.run_full != 'false'
        uses: actions/upload-artifact@v4
        with:
          name: lumen-validation-reports
          path: |
            docs/validation/ci-browser.json
            docs/validation/ci-ux.json
            docs/validation/ci-learning.json
            docs/validation/ci-late-game.json
            docs/validation/ci-sky-navigation.json
            docs/validation/ci-account-session.json
            docs/validation/ci-canonical-replay.json
            docs/validation/ci-personal-records.json
            docs/validation/ci-adventure-05.json
            docs/validation/ci-iau-completion.json
            docs/validation/ci-iau-completion-cloud.json
            docs/validation/ci-offline-hint.json
            docs/validation/ci-offline-hint-network.json
            docs/validation/ci-drag-cascade.json
            docs/validation/ci-adventure-mastery.json
            docs/validation/ci-quality-summary.json
          retention-days: 14
          if-no-files-found: ignore
