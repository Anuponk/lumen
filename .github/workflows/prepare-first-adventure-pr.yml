name: Prepare first adventure content PR
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/prepare-first-adventure-pr.yml'
permissions:
  contents: write
  pull-requests: write
jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate constellation catalogue
        run: node --test scripts/constellation-preview.test.mjs scripts/first-adventure-preview.test.mjs
      - name: Generate and audit first adventure
        run: node scripts/export-first-adventure.mjs
      - name: Prepare immutable staging snapshot
        run: |
          mkdir -p content/generated
          cp artifacts/first-adventure-generated.json content/generated/first-adventure.json
      - name: Push staged content to review branch (never publish to runtime)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B generated/first-adventure-100-quests
          git add content/generated/first-adventure.json
          git commit -m "content: stage audited first adventure of 100 quests" || exit 0
          git push --force-with-lease origin generated/first-adventure-100-quests
