name: Deploy Lumen to o2switch
on:
  workflow_run:
    workflows: ['Cloud reconciliation matrix']
    branches: [main]
    types: [completed]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: lumen-o2switch-production
  cancel-in-progress: false
# TigerProtect (o2switch default rules) intermittently rejects GitHub runner IPs
# with HTTP 503 before PHP. A new job gets a new runner (usually a new IP), so a
# hosting-filter refusal (exit 75) is retried by up to two further jobs. Every
# other failure (gates, server publication, SHA mismatch) stops immediately.
jobs:
  deploy:
    if: >-
      vars.O2SWITCH_DEPLOY_ENABLED == 'true' &&
      ((github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') ||
       (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.event != 'pull_request' &&
        github.event.workflow_run.head_repository.full_name == github.repository))
    runs-on: ubuntu-latest
    timeout-minutes: 12
    environment:
      name: production
      url: https://lumen.nopuna.fr
    outputs:
      result: ${{ steps.publish.outputs.result }}
    env:
      DEPLOY_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
      O2SWITCH_DEPLOY_WEBHOOK_SECRET: ${{ secrets.O2SWITCH_DEPLOY_WEBHOOK_SECRET }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.DEPLOY_SHA }}
          persist-credentials: false
      - name: Verify merged PR quality and exact-commit release gates
        shell: bash
        run: |
          set -euo pipefail
          for attempt in {1..40}; do
            result=0
            python3 scripts/o2switch-ci-status.py "$DEPLOY_SHA" || result=$?
            if [[ "$result" == 0 ]]; then exit 0; fi
            if [[ "$result" != 75 ]]; then exit "$result"; fi
            sleep 5
          done
          echo '::error::Release gates still pending'
          exit 1
      - name: Publish and verify the exact commit over authenticated HTTPS
        id: publish
        shell: bash
        run: bash scripts/o2switch-publish-attempt.sh

  deploy-retry-1:
    needs: deploy
    if: needs.deploy.outputs.result == 'blocked'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    environment:
      name: production
      url: https://lumen.nopuna.fr
    outputs:
      result: ${{ steps.publish.outputs.result }}
    env:
      DEPLOY_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
      O2SWITCH_DEPLOY_WEBHOOK_SECRET: ${{ secrets.O2SWITCH_DEPLOY_WEBHOOK_SECRET }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.DEPLOY_SHA }}
          persist-credentials: false
      - name: Publish from a fresh runner after a hosting-filter refusal
        id: publish
        shell: bash
        run: sleep 60 && bash scripts/o2switch-publish-attempt.sh

  deploy-retry-2:
    needs: deploy-retry-1
    if: needs.deploy-retry-1.outputs.result == 'blocked'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    environment:
      name: production
      url: https://lumen.nopuna.fr
    outputs:
      result: ${{ steps.publish.outputs.result }}
    env:
      DEPLOY_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
      O2SWITCH_DEPLOY_WEBHOOK_SECRET: ${{ secrets.O2SWITCH_DEPLOY_WEBHOOK_SECRET }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.DEPLOY_SHA }}
          persist-credentials: false
      - name: Publish from a fresh runner after a hosting-filter refusal
        id: publish
        shell: bash
        run: sleep 60 && bash scripts/o2switch-publish-attempt.sh

  confirm:
    needs: [deploy, deploy-retry-1, deploy-retry-2]
    if: always() && needs.deploy.result != 'skipped'
    runs-on: ubuntu-latest
    timeout-minutes: 2
    env:
      DEPLOY_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
      RESULTS: ${{ needs.deploy.outputs.result }} ${{ needs.deploy-retry-1.outputs.result }} ${{ needs.deploy-retry-2.outputs.result }}
    steps:
      - name: Require one verified publication
        shell: bash
        run: |
          set -euo pipefail
          echo "Attempt results: $RESULTS"
          if [[ " $RESULTS " == *" published "* ]]; then
            printf 'Published Lumen commit `%s` to https://lumen.nopuna.fr\n' "$DEPLOY_SHA" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          echo '::error::No verified publication (hosting filter refused every runner, or a non-retryable failure occurred)'
          exit 1
