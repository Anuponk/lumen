name: Deploy Lumen to o2switch
on:
  workflow_run:
    workflows: ['Lumen quality gate']
    branches: [main]
    types: [completed]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: lumen-o2switch-production
  cancel-in-progress: false
jobs:
  deploy:
    if: >-
      vars.O2SWITCH_DEPLOY_ENABLED == 'true' &&
      ((github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') ||
       (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.event != 'pull_request' &&
        github.event.workflow_run.head_repository.full_name == github.repository))
    runs-on: ubuntu-latest
    timeout-minutes: 12
    environment:
      name: production
      url: https://lumen.nopuna.fr
    env:
      DEPLOY_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
      O2SWITCH_DEPLOY_WEBHOOK_SECRET: ${{ secrets.O2SWITCH_DEPLOY_WEBHOOK_SECRET }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.DEPLOY_SHA }}
          persist-credentials: false
      - name: Wait for every release gate on the exact commit
        shell: bash
        run: |
          set -euo pipefail
          for attempt in {1..40}; do
            result=0
            python3 scripts/o2switch-ci-status.py "$DEPLOY_SHA" || result=$?
            if [[ "$result" == 0 ]]; then exit 0; fi
            if [[ "$result" != 75 ]]; then exit "$result"; fi
            sleep 5
          done
          echo '::error::Release gates still pending'
          exit 1
      - name: Publish and verify the exact commit over authenticated HTTPS
        run: python3 scripts/o2switch-https-deploy.py
      - name: Record verified publication
        shell: bash
        run: printf 'Published Lumen commit `%s` to https://lumen.nopuna.fr\n' "$DEPLOY_SHA" >> "$GITHUB_STEP_SUMMARY"
