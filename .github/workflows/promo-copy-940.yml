name: Regenerate promotional OG assets for PR 940
on:
  push:
    branches: [fix/932-promo-copy-100-free-puzzles]
    paths:
      - '.github/workflows/promo-copy-940.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  regenerate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/932-promo-copy-100-free-puzzles
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run local preview server and Chromium CDP
        shell: bash
        run: |
          set -euo pipefail
          python3 -m http.server 8000 --bind 127.0.0.1 >/tmp/lumen-http.log 2>&1 &
          echo $! > /tmp/lumen-http.pid
          CHROME="$(command -v google-chrome || command -v chromium || command -v chromium-browser)"
          "$CHROME" --headless=new --no-sandbox --disable-dev-shm-usage --disable-gpu --remote-debugging-port=9222 --remote-debugging-address=127.0.0.1 --user-data-dir=/tmp/lumen-og-940 about:blank >/tmp/lumen-chrome.log 2>&1 &
          echo $! > /tmp/lumen-chrome.pid
          for i in $(seq 1 60); do
            if curl --silent --fail http://127.0.0.1:9222/json >/dev/null; then break; fi
            sleep 1
          done
          curl --fail http://127.0.0.1:9222/json >/dev/null
      - name: Regenerate JPGs and actual preview screenshots
        env:
          LUMEN_TEST_URL: http://127.0.0.1:8000/
          LUMEN_CDP_URL: http://127.0.0.1:9222
        run: node scripts/promo-og-assets.mjs --preview-dir=docs/validation
      - name: Verify assets and source copy
        shell: bash
        run: |
          node scripts/landing-seo-tests.mjs
          test -s src/landing/og.jpg
          test -s src/landing/og-en.jpg
          test -s docs/validation/og-promo-fr-small.png
          test -s docs/validation/og-promo-en-small.png
      - name: Commit only generated artifacts to existing PR branch
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/landing/og.jpg src/landing/og-en.jpg docs/validation/og-promo-fr-small.png docs/validation/og-promo-en-small.png
          if git diff --cached --quiet; then
            echo 'Assets identical; no commit required.'
          else
            git commit -m 'assets(marketing): regenerate FR/EN 100 free puzzles OG previews (#932)'
            git push origin HEAD:fix/932-promo-copy-100-free-puzzles
          fi
