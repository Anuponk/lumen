          psql -h localhost -U postgres -d lumen_test -v ON_ERROR_STOP=1 \
            -f /tmp/lumen-social-bootstrap.sql \
            -f supabase/migrations/20261023181900_quest_social_identity.sql \
            -f scripts/fixtures/quest-social-identity.sql
          psql -h localhost -U postgres -d lumen_test -v ON_ERROR_STOP=1 \
            -f scripts/fixtures/quest-analytics-bootstrap.sql \
            -f supabase/migrations/20261023181918_quest_analytics_identity.sql \
            -f scripts/fixtures/quest-analytics-identity.sql \
            -f supabase/migrations/20261025191634_cockpit_furthest_quest.sql \
            -f scripts/fixtures/cockpit-furthest-quest.sql

          psql -h localhost -U postgres -d lumen_test -v ON_ERROR_STOP=1 \
            -f supabase/migrations/20261023103114_diagnostic_incident_mvp.sql \
            -f supabase/migrations/20261023104105_diagnostic_batch_identity_guard.sql \
            -f scripts/fixtures/diagnostic-incidents.sql
          python3 scripts/diagnostic-concurrency.py
          psql -h localhost -U postgres -d lumen_test -v ON_ERROR_STOP=1 \
            -f supabase/migrations/20261025200603_temporary_support.sql \
            -f scripts/fixtures/support.sql
          python3 scripts/support-concurrency.py
          psql -h localhost -U postgres -d lumen_test -v ON_ERROR_STOP=1 -f scripts/fixtures/cockpit-dates.sql
          psql -h localhost -U postgres -d lumen_test -v ON_ERROR_STOP=1 -f scripts/fixtures/cockpit-sessions.sql
          psql -h localhost -U postgres -d lumen_test -v ON_ERROR_STOP=1 \
            -f supabase/migrations/20261023211412_historical_claim_rollout.sql \
            -f scripts/fixtures/historical-claim-rollout.sql
          python3 scripts/guest-claim-concurrency.py
          psql -h localhost -U postgres -d lumen_test -v ON_ERROR_STOP=1 \
            -f supabase/migrations/20261024042823_sync_cohort_activation_control.sql \
            -f scripts/fixtures/sync-cohort-control.sql

      - name: Verify records, append-only catalogue and complete victory parity
        env:
