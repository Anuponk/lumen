name: Canonical ledger SQL regression
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, converted_to_draft]
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  # Main always runs the full suite and needs no pull request classification.
  scope:
    if: github.event_name == 'pull_request' && github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    outputs:
      scope: ${{ steps.scope.outputs.scope }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Classify the pull request scope
        id: scope
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        shell: bash
        run: |
          echo "scope=full" >> "$GITHUB_OUTPUT"
          if [[ "$GITHUB_EVENT_NAME" != "pull_request" || -z "$BASE_SHA" || -z "$HEAD_SHA" ]]; then exit 0; fi
          git diff --name-only --no-renames "$BASE_SHA" "$HEAD_SHA" > /tmp/lumen-changed-paths || exit 0
          # #744: classify with the BASE version of the script, so a pull request can never
          # loosen its own scope; a base without the script keeps the full gate.
          if git show "$BASE_SHA:scripts/ci-scope.mjs" > /tmp/ci-scope.mjs 2>/dev/null; then
            node /tmp/ci-scope.mjs /tmp/lumen-changed-paths
          else
            echo "Scope classifier absent from the base; running the full gate"
          fi
  # The two routes can publish the required check name only when eligible.
  landing-check:
    needs: scope
    name: >-
      ${{ (github.event_name == 'pull_request' && github.event.pull_request.draft == false &&
      needs.scope.result == 'success' && needs.scope.outputs.scope == 'landing') &&
      'ledger-sql' || 'ledger-sql-landing-deferred' }}
    if: >-
      ${{ !cancelled() && (github.event_name == 'pull_request' && github.event.pull_request.draft == false &&
      needs.scope.result == 'success' && needs.scope.outputs.scope == 'landing') }}
    runs-on: ubuntu-latest
    steps:
      - name: Confirm the reviewed presentation-only scope
        run: echo 'The base classifier confirmed a presentation-only pull request.'

  ledger-sql:
    needs: scope
    name: >-
      ${{ (github.event_name == 'push' ||
      (github.event_name == 'pull_request' && github.event.pull_request.draft == false &&
      (needs.scope.result != 'success' || needs.scope.outputs.scope != 'landing'))) &&
      'ledger-sql' || 'ledger-sql-deferred' }}
    if: >-
      ${{ !cancelled() && (github.event_name == 'push' ||
      (github.event_name == 'pull_request' && github.event.pull_request.draft == false &&
      (needs.scope.result != 'success' || needs.scope.outputs.scope != 'landing'))) }}
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: isolated-test-only
          POSTGRES_DB: lumen_test
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - name: Test the real ledger migrations in disposable PostgreSQL
        env:
          PGPASSWORD: isolated-test-only
        run: >-
          psql -h localhost -U postgres -d lumen_test -v ON_ERROR_STOP=1
          -f scripts/fixtures/canonical-ledger-bootstrap.sql
          -f supabase/migrations/20261015_canonical_reward_ledger.sql
          -f supabase/migrations/20261017033619_canonical_replay_badges.sql
          -f scripts/fixtures/canonical-ledger-replay.sql
          -f supabase/migrations/20261009_lumen_profile_snapshots.sql
          -f supabase/migrations/20261010_lumen_cloud_first_cas.sql
          -f supabase/migrations/20261017180841_protect_canonical_snapshot.sql
          -f scripts/fixtures/canonical-snapshot-guard.sql
          -f supabase/migrations/20261017181513_sync_health_incident_tracking.sql
          -f scripts/fixtures/sync-health-incidents.sql
          -f supabase/migrations/20261018153436_canonical_command_receipts.sql
          -f scripts/fixtures/canonical-command-receipts.sql
      - name: Verify concurrent immutable commands in disposable PostgreSQL
        env:
          PGPASSWORD: isolated-test-only
          LUMEN_SQL_FIXTURE: '1'
        run: python3 scripts/canonical-command-concurrency.py
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify historical rules, transactions and old-writer retirement
        env:
          PGPASSWORD: isolated-test-only
          LUMEN_SQL_FIXTURE: '1'
        run: |
          node scripts/legacy-command-fixtures.mjs --check
          node scripts/legacy-command-fixtures.mjs > /tmp/lumen-legacy-parity.sql
          psql -h localhost -U postgres -d lumen_test -v ON_ERROR_STOP=1 \
            -f scripts/fixtures/legacy-command-bootstrap.sql \
            -f supabase/migrations/20261003_lumen_daily_server_authority.sql \
            -f supabase/migrations/20261010_lumen_daily_catalogue_ceiling_repair.sql \
            -f supabase/migrations/20261018193133_legacy_victory_commands.sql \
            -f supabase/migrations/20261020084328_legacy_attempt_counter_metadata.sql \
            -f supabase/migrations/20261023045558_guest_progress_and_badge_eligibility.sql \
            -f scripts/fixtures/legacy-command-receipts.sql \
            -f scripts/fixtures/legacy-attempt-counter.sql
          python3 scripts/legacy-command-concurrency.py
          node scripts/catalogue-origin-fixtures.mjs > /tmp/lumen-catalogue-origin.sql
          psql -h localhost -U postgres -d lumen_test -v ON_ERROR_STOP=1 \
            -f scripts/fixtures/catalogue-origin-before.sql \
            -f supabase/migrations/20261018200805_catalogue_origin_access.sql \
            -f scripts/fixtures/catalogue-origin.sql
          psql -h localhost -U postgres -d lumen_test -v ON_ERROR_STOP=1 \
            -f supabase/migrations/20261022082153_wallet_command_authority.sql \
            -f scripts/fixtures/wallet-command-receipts.sql \
            -f scripts/fixtures/first-quest-badges.sql \
            -f supabase/migrations/20261022082203_outbox_health_observations.sql \
            -f scripts/fixtures/outbox-health-observations.sql
          python3 scripts/wallet-command-concurrency.py
          node scripts/quest-command-fixtures.mjs --check
          node scripts/quest-command-fixtures.mjs --grid-revision 1 > /tmp/lumen-quest-parity.sql
          psql -h localhost -U postgres -d lumen_test -v ON_ERROR_STOP=1 \
            -f supabase/migrations/20261023181850_quest_contract_convergence.sql \
            -f scripts/fixtures/quest-first-badges.sql \
            -f scripts/fixtures/quest-command-receipts.sql \
