name: Privacy SQL integration
on:
  pull_request:
    branches: [main]
    paths:
      - 'supabase/migrations/20261022160212_lumen_account_erasure.sql'
      - 'scripts/privacy-sql-integration.py'
      - '.github/workflows/privacy-sql-integration.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  privacy-sql:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: privacy_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGHOST: localhost
      PGPORT: '5432'
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: privacy_test
    steps:
      - uses: actions/checkout@v4
      - name: Run real PostgreSQL erasure-scope integration test
        run: python3 scripts/privacy-sql-integration.py
