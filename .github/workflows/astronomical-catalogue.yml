name: Build and validate real astronomy catalogue

on:
  pull_request:
    paths:
      - '.github/workflows/astronomical-catalogue.yml'
      - 'scripts/fetch-hipparcos-line-stars.py'
      - 'scripts/build-astronomical-catalogue.mjs'
      - 'scripts/validate-playable-astronomy.mjs'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  astronomy:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install astronomy preparation dependencies
        run: python -m pip install 'astropy==7.2.0' 'astroquery==0.4.10'
      - name: Fetch pinned Stellarium Western data (CC BY-SA)
        run: |
          mkdir -p .cache/astronomy
          curl --fail --location --retry 3 --retry-delay 4 --max-time 90 \
            -o .cache/astronomy/western-index.json \
            'https://raw.githubusercontent.com/Stellarium/stellarium-skycultures/70471c1a3f4da066751e33eb4cd8f168aefeba00/western/index.json'
      - name: Fetch Hipparcos II line stars from VizieR
        run: python scripts/fetch-hipparcos-line-stars.py .cache/astronomy/western-index.json .cache/astronomy/hip-lines.json --cache .cache/astronomy/hipparcos2.ecsv
      - name: Build full astronomical catalogue
        run: node scripts/build-astronomical-catalogue.mjs .cache/astronomy/western-index.json .cache/astronomy/hip-lines.json .cache/astronomy/report.json
      - name: Validate all 40 Lumen constellation identities
        run: node scripts/validate-playable-astronomy.mjs .cache/astronomy/report.json
      - name: Upload audit report and positions for review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lumen-astronomical-import-audit
          path: |
            .cache/astronomy/report.json
            .cache/astronomy/hip-lines.json
          if-no-files-found: warn
          retention-days: 14
