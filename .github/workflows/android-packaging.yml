name: Android packaging

on:
  pull_request:
    branches: [main]
    paths: ['android/**', '.github/workflows/android-packaging.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-packaging-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  packaging:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
      - name: Static packaging and DAL regression tests
        run: node --test tools/packaging.test.mjs
      - name: Install pinned SDK
        run: sdkmanager 'platforms;android-36' 'build-tools;35.0.0'
      - name: Build without any release credentials
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon --console=plain :app:lint :app:assembleDebug :app:bundleDebug :app:bundleRelease
      - name: Validate compiled APK and AAB
        run: |
          curl --fail --location --retry 3 --output "$RUNNER_TEMP/bundletool.jar" https://github.com/google/bundletool/releases/download/1.18.2/bundletool-all-1.18.2.jar
          echo "378b5434cd1378bef6b2bc527b8c7f0ff2584b273830335bce54d6d0813c8584  $RUNNER_TEMP/bundletool.jar" | sha256sum --check
          python3 tools/verify-artifacts.py "$RUNNER_TEMP/bundletool.jar"
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: lumen-android-test-${{ github.sha }}
          path: |
            android/app/build/outputs/apk/debug/app-debug.apk
            android/app/build/outputs/bundle/debug/app-debug.aab
            android/app/build/outputs/bundle/release/app-release.aab
            android/app/build/outputs/packaging-verification.json
          if-no-files-found: error
          retention-days: 14
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lumen-android-reports-${{ github.sha }}
          path: android/app/build/reports/
          retention-days: 14

  startup-smoke:
    name: Android emulator launch smoke
    runs-on: ubuntu-latest
    timeout-minutes: 35
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
      - name: Build debug APK
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon --console=plain :app:assembleDebug
      - name: Enable hardware acceleration for emulator
        run: |
          if [ ! -e /dev/kvm ]; then
            echo "::error::KVM device missing on GitHub runner; cannot perform reliable emulator launch test."
            exit 1
          fi
          sudo chmod 666 /dev/kvm
          test -w /dev/kvm
      - name: Boot Android and diagnose app startup
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          working-directory: android
          script: |
            set -eu
            adb install -r app/build/outputs/apk/debug/app-debug.apk
            adb logcat -c
            adb shell am start -W -n fr.nopuna.lumen.debug/com.google.androidbrowserhelper.trusted.LauncherActivity
            sleep 12
            adb logcat -d -v time > android-startup-logcat.txt
            if grep -E -A 25 'FATAL EXCEPTION|Process: fr\\.nopuna\\.lumen\\.debug' android-startup-logcat.txt | grep -E -q 'FATAL EXCEPTION|Process: fr\\.nopuna\\.lumen\\.debug'; then
              echo 'Potential Android runtime crash detected; inspect uploaded Logcat.'
              grep -E -A 35 'FATAL EXCEPTION|Process: fr\\.nopuna\\.lumen\\.debug' android-startup-logcat.txt | head -100
              exit 1
            fi
            echo 'No fatal exception observed; launch success alone does not certify TWA display or device compatibility.'
      - name: Preserve Android startup evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lumen-android-emulator-startup-${{ github.sha }}
          path: android/android-startup-logcat.txt
          if-no-files-found: warn
          retention-days: 7
