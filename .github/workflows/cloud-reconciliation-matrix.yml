name: Cloud reconciliation matrix
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  reconciliation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Reconciliation and fault matrix
        run: |
          node scripts/diagnostic-reporter-tests.mjs
          node scripts/storage-maintenance-tests.mjs
          node scripts/cloud-achievements-session-recovery-tests.mjs
          node scripts/cloud-achievements-quota-recovery-tests.mjs
          node scripts/cloud-wallet-quota-recovery-tests.mjs
          node scripts/cloud-hydration-mirror-session-tests.mjs
          node scripts/cloud-profile-transitions-tests.mjs
          node scripts/cloud-reconciliation-matrix-tests.mjs
          node scripts/cloud-balance-reconciliation-tests.mjs
          node scripts/cloud-local-quota-tests.mjs
          node scripts/cloud-unsynced-recovery-tests.mjs
