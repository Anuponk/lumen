name: Documentation consistency
on:
  pull_request:
  push:
    branches: [main]
jobs:
  docs-consistency:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate documentation contracts and changed module coverage
        env:
          DOCS_BASE_REF: ${{ github.event_name == 'pull_request' && format('origin/{0}', github.base_ref) || '' }}
        run: node scripts/docs-consistency-check.mjs
