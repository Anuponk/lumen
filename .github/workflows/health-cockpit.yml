name: Health cockpit tests
on:
  pull_request:
    branches: [main]
    paths:
      - 'src/ui/health-cockpit.js'
      - 'scripts/lumen_health_digest.py'
      - 'scripts/lumen_critical_monitor*.py'
      - 'scripts/lumen_activity_mail*.py'
      - 'scripts/fixtures/health-cockpit.sql'
      - 'supabase/migrations/*health_cockpit_949.sql'
      - '.github/workflows/health-cockpit.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  health-cockpit:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - run: python3 -B scripts/lumen_activity_mail_tests.py
      - run: python3 -B scripts/lumen_critical_monitor_tests.py
      - name: Verify health projection and daily deduplication
        env:
          PG_CONTAINER: ${{ job.services.postgres.id }}
        run: |
          cat scripts/fixtures/admin-activity-mail-bootstrap.sql \
            supabase/migrations/20261122200000_admin_activity_mail_950.sql \
            scripts/fixtures/critical-incidents-bootstrap.sql \
            supabase/migrations/20261122210000_critical_incidents_947.sql \
            supabase/migrations/20261122210000_critical_incidents_947.sql \
            scripts/fixtures/performance-monitor-bootstrap.sql \
            supabase/migrations/20261122220000_performance_monitor_948.sql \
            supabase/migrations/20261122220000_performance_monitor_948.sql \
            supabase/migrations/20261122230000_health_cockpit_949.sql \
            supabase/migrations/20261122230000_health_cockpit_949.sql \
            scripts/fixtures/health-cockpit.sql |
            docker exec -i --user postgres "$PG_CONTAINER" psql -X -v ON_ERROR_STOP=1
