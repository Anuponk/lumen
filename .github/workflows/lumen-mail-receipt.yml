name: Lumen mail receipt
on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/lumen-mail-receipt.yml'
      - 'scripts/lumen_activity_mail*.py'
      - 'scripts/o2switch-activity-mail.sh'
      - 'scripts/fixtures/activity-mail-receipt.sql'
      - 'scripts/fixtures/*-bootstrap.sql'
      - 'supabase/migrations/20261122*.sql'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: lumen-mail-receipt-${{ github.ref }}
  cancel-in-progress: false

jobs:
  receipt-simulation:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
        options: --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: bash -n scripts/o2switch-activity-mail.sh
      - run: python3 -B scripts/lumen_activity_mail_receipt.py
        env:
          PG_CONTAINER: ${{ job.services.postgres.id }}
