name: Admin activity notifications
on:
  pull_request:
    branches: [main]
    paths:
      - 'scripts/lumen_activity_mail.py'
      - 'scripts/lumen_activity_mail_tests.py'
      - 'scripts/fixtures/admin-activity-mail*.sql'
      - 'supabase/migrations/*admin_activity_mail_950.sql'
      - '.github/workflows/admin-activity-mail.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  activity-mail:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PG_CONTAINER: ${{ job.services.postgres.id }}
    steps:
      - uses: actions/checkout@v4
      - run: python3 -B scripts/lumen_activity_mail_tests.py
      - name: Run notification fixtures using the isolated database socket
        run: |
          cat scripts/fixtures/admin-activity-mail-bootstrap.sql \
            supabase/migrations/20261122200000_admin_activity_mail_950.sql \
            supabase/migrations/20261122200000_admin_activity_mail_950.sql \
            scripts/fixtures/admin-activity-mail.sql |
            docker exec -i --user postgres "$PG_CONTAINER" psql -X -v ON_ERROR_STOP=1
