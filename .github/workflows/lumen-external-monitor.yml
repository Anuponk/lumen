name: External Lumen health probe
on:
  schedule:
    - cron: '3,8,13,18,23,28,33,38,43,48,53,58 * * * *'
  workflow_dispatch:
    inputs:
      record_observation:
        description: Record the observation in SoldeZen
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: lumen-external-health
  cancel-in-progress: false

jobs:
  public-probe:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && !inputs.record_observation
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@v4
      - run: python3 -B scripts/lumen_critical_monitor.py

  incident-monitor:
    if: >-
      github.ref == 'refs/heads/main' && vars.LUMEN_CRITICAL_MONITOR_ENABLED == '1'
      && (github.event_name == 'schedule'
      || (github.event_name == 'workflow_dispatch' && inputs.record_observation))
    runs-on: ubuntu-latest
    timeout-minutes: 8
    environment:
      name: production
      deployment: false
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Observe public availability and queue notices
        env:
          LUMEN_CRITICAL_MONITOR_ENABLED: '1'
          LUMEN_PERFORMANCE_MONITOR_ENABLED: ${{ vars.LUMEN_PERFORMANCE_MONITOR_ENABLED || '0' }}
          LUMEN_ACTIVITY_SUPABASE_URL: ${{ vars.LUMEN_ACTIVITY_SUPABASE_URL }}
          LUMEN_ACTIVITY_SUPABASE_KEY: ${{ secrets.LUMEN_ACTIVITY_SUPABASE_KEY }}
          LUMEN_CRITICAL_STALL_MINUTES: ${{ vars.LUMEN_CRITICAL_STALL_MINUTES || '15' }}
          LUMEN_CRITICAL_FAILURES: ${{ vars.LUMEN_CRITICAL_FAILURES || '3' }}
          LUMEN_CRITICAL_RECOVERIES: ${{ vars.LUMEN_CRITICAL_RECOVERIES || '2' }}
          LUMEN_CRITICAL_BACKLOG: ${{ vars.LUMEN_CRITICAL_BACKLOG || '20' }}
        run: python3 -B scripts/lumen_critical_monitor.py
